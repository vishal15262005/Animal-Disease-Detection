<!DOCTYPE html>
<html>
<head>
    <title>Dog Disease Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="language-settings">
        <button class="settings-btn" onclick="toggleSettings()">
            <span class="settings-icon">⚙️</span>
            <span>Settings</span>
        </button>
        <div class="settings-menu" id="settingsMenu">
            <div class="menu-item" onclick="toggleLanguageOptions()">
                <span class="lang-icon">🌐</span>
                <span>Language</span>
                <span class="current-lang">EN</span>
            </div>
            <div class="menu-item" onclick="toggleMobileFormat()">
                <span class="mobile-icon">📱</span>
                <span class="mode-text">Desktop Mode</span>
            </div>
            <div class="language-options" id="languageMenu">
                <div class="submenu-item" onclick="changeLanguage('en')">
                    <span class="lang-flag">🇬🇧</span>
                    English
                </div>
                <div class="submenu-item" onclick="changeLanguage('ta')">
                    <span class="lang-flag">🇮🇳</span>
                    தமிழ்
                </div>
                <div class="submenu-item" onclick="changeLanguage('hi')">
                    <span class="lang-flag">🇮🇳</span>
                    हिन्दी
                </div>
            </div>
        </div>
    </div>
    <div class="detection-page dog-theme">
        <!-- Add background video -->
        <video autoplay muted loop playsinline class="dog-bg-video">
            <source src="{{ url_for('static', filename='videos/dog-bg.mp4') }}" type="video/mp4">
        </video>
        
        <div class="detection-container">
            <h1 class="page-title">Dog Disease Detection</h1>
            
            <div class="detection-methods">
                <div class="method-card">
                    <h2>Use Camera</h2>
                    <div class="camera-container">
                        <video id="video" autoplay playsinline></video>
                        <canvas id="canvas" style="display: none;"></canvas>
                        <div class="camera-controls">
                            <button id="start-camera" class="action-btn">Turn On Camera</button>
                            <button id="capture-btn" class="action-btn" disabled>Capture Image</button>
                        </div>
                    </div>
                </div>

                <div class="method-divider">
                    <span>OR</span>
                </div>

                <div class="method-card">
                    <h2>Upload Images</h2>
                    <div class="upload-section">
                        <div class="upload-icon">📁</div>
                        <form id="upload-form" class="upload-form">
                            <input type="file" name="files" id="file" class="file-input" accept="image/*" multiple>
                            <label for="file" class="upload-btn">Choose Files (Max 5)</label>
                            <div id="file-list" class="file-list"></div>
                            <button type="submit" class="submit-btn">Analyze Images</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="preview-section" id="preview">
                <h3>Image Preview</h3>
                <div id="preview-container" class="preview-container"></div>
                <div class="disease-warning" id="disease-warning">
                    Warning: Disease Detected! Please consult a veterinarian.
                </div>
            </div>
            
            <div class="result-section hidden" id="result">
                <h2 class="result-title">Detection Result</h2>
                <div class="result-details">
                    <p id="prediction-text"></p>
                    <p id="confidence-text"></p>
                    <p id="total-images-text"></p>
                </div>
                
                <div id="votes-info" class="votes-info"></div>
                <div id="individual-results" class="individual-results"></div>
                
                <div id="disease-info" class="disease-info"></div>
                

                <button onclick="generatePDF(window.lastResult)" class="download-btn">
                    <span class="download-icon">📥</span> Download Report (PDF)
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        let lastResult = null;
        
        const fileInput = document.getElementById('file');
        const uploadForm = document.getElementById('upload-form');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const files = fileInput.files;
            if (!files || files.length === 0) {
                alert('Please select at least one image file');
                return;
            }

            if (files.length > 5) {
                alert('Maximum 5 images allowed');
                return;
            }
            
            // Show loading state
            const submitBtn = uploadForm.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Analyzing...';
            
            const formData = new FormData();
            for (let file of files) {
                formData.append('files', file);
            }
            
            try {
                const response = await fetch(`/predict?animal_type=dog`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.error) {
                    alert(result.error);
                    return;
                }
                
                // Store result for PDF generation
                lastResult = result;
                
                // Display preview of all images
                displayImagePreviews(files);
                document.getElementById('preview').classList.add('active');
                
                // Handle disease detection UI updates
                handlePredictionResult(result);
                document.getElementById('result').classList.remove('hidden');
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error processing images. Please try again.');
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                submitBtn.textContent = 'Analyze Images';
            }
        });

        function displayImagePreviews(files) {
            const previewContainer = document.getElementById('preview-container');
            previewContainer.innerHTML = '';
            
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'preview-img';
                    previewContainer.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        }

        function handlePredictionResult(result) {
            try {
                const previewSection = document.getElementById('preview');
                const resultSection = document.getElementById('result');
                const warningDiv = document.getElementById('disease-warning');
                const diseaseInfo = document.getElementById('disease-info');
                const predictionText = document.getElementById('prediction-text');
                const confidenceText = document.getElementById('confidence-text');
                const totalImagesText = document.getElementById('total-images-text');
                const votesInfo = document.getElementById('votes-info');
                const individualResults = document.getElementById('individual-results');

                // Show result section
                resultSection.style.display = 'block';
                resultSection.classList.remove('hidden');

                // Update prediction text and confidence score
                predictionText.textContent = `Disease: ${result.prediction}`;
                confidenceText.textContent = `Confidence: ${(result.confidence * 100).toFixed(2)}%`;
                totalImagesText.textContent = `Images Analyzed: ${result.total_images}`;

                // Display voting information
                votesInfo.innerHTML = `<h4>Results Summary:</h4>`;
                for (let [className, count] of Object.entries(result.votes)) {
                    const percentage = ((count / result.total_images) * 100).toFixed(1);
                    votesInfo.innerHTML += `<p>${className}: ${count}/${result.total_images} (${percentage}%)</p>`;
                }

                // Display individual image results
                individualResults.innerHTML = '<h4>Individual Image Results:</h4>';
                result.details.forEach((detail, index) => {
                    const detailHTML = `
                        <div class="individual-result">
                            <strong>Image ${index + 1}:</strong> ${detail.prediction} (${(detail.confidence * 100).toFixed(2)}%)
                        </div>
                    `;
                    individualResults.innerHTML += detailHTML;
                });

                // Check if disease is detected
                const isDiseaseDetected = result.prediction.toLowerCase() !== 'healthy';

                if (isDiseaseDetected) {
                    previewSection.classList.add('disease-detected');
                    resultSection.classList.add('disease-detected');
                    warningDiv.classList.add('visible');
                    predictionText.style.color = '#d32f2f';

                    diseaseInfo.innerHTML = `
                        <div class="disease-details">
                            <h3>About ${result.prediction}</h3>
                            <div class="info-section">
                                <h4>Treatment Recommendations</h4>
                                <ul>
                                    <li>Consult veterinarian immediately</li>
                                    <li>Follow prescribed treatment</li>
                                    <li>Maintain hygiene</li>
                                    <li>Monitor recovery progress</li>
                                    <li>Keep the animal isolated if contagious</li>
                                    <li>Record treatment progress</li>
                                </ul>
                            </div>
                        </div>`;
                } else {
                    predictionText.style.color = '#4CAF50';
                    diseaseInfo.innerHTML = `
                        <div class="precautions-details">
                            <h3>Preventive Care Tips</h3>
                            <ul>
                                <li>Regular veterinary check-ups</li>
                                <li>Maintain proper hygiene</li>
                                <li>Balanced nutrition</li>
                                <li>Regular exercise</li>
                                <li>Keep vaccinations up to date</li>
                                <li>Monitor for any changes in health</li>
                            </ul>
                        </div>`;
                }
            } catch (error) {
                console.error('Error handling prediction:', error);
            }
        }

        // File input change handler
        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            const fileList = document.getElementById('file-list');
            fileList.innerHTML = '';
            
            if (files.length > 5) {
                fileList.innerHTML = '<p style="color: red;">Maximum 5 files allowed</p>';
                return;
            }
            
            for (let file of files) {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.textContent = `✓ ${file.name}`;
                fileList.appendChild(fileItem);
            }
        });

        function generatePDF(result) {
            if (!result) {
                alert('No results to download');
                return;
            }
            
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFontSize(22);
                doc.setTextColor(230, 126, 34); // Dog theme color
                doc.text("Dog Disease Detection Report", 105, 20, { align: "center" });
                
                doc.setFontSize(12);
                doc.setTextColor(100);
                const date = new Date().toLocaleString();
                doc.text(`Generated on: ${date}`, 20, 30);
                
                doc.setFontSize(16);
                doc.setTextColor(0);
                doc.text("Detection Results", 20, 45);
                
                doc.setFontSize(14);
                doc.text(`Final Result: ${result.prediction}`, 20, 55);
                doc.text(`Confidence: ${(result.confidence * 100).toFixed(2)}%`, 20, 65);
                doc.text(`Images Analyzed: ${result.total_images}`, 20, 75);
                
                let yPos = 95;
                doc.setFontSize(12);
                doc.text("Results Summary:", 20, yPos);
                yPos += 10;
                
                for (let [className, count] of Object.entries(result.votes)) {
                    const percentage = ((count / result.total_images) * 100).toFixed(1);
                    doc.text(`${className}: ${count}/${result.total_images} (${percentage}%)`, 25, yPos);
                    yPos += 8;
                }
                
                yPos += 5;
                doc.text("Individual Results:", 20, yPos);
                yPos += 8;
                
                result.details.forEach((detail, index) => {
                    doc.text(`Image ${index + 1}: ${detail.prediction} (${(detail.confidence * 100).toFixed(2)}%)`, 25, yPos);
                    yPos += 8;
                    if (yPos > 270) {
                        doc.addPage();
                        yPos = 20;
                    }
                });
                
                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text("This report was generated automatically by VetCare AI", 105, 280, { align: "center" });
                
                const filename = `Dog-disease-detection-report-${new Date().toISOString().slice(0,10)}.pdf`;
                doc.save(filename);

            } catch (error) {
                console.error('Error generating PDF:', error);
                alert('Error generating PDF. Please ensure jsPDF library is loaded.');
            }
        }

        // Camera and image upload handling code remains unchanged

        // Language translation and initialization code remains unchanged
    </script>
    <script src="{{ url_for('static', filename='translations.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
